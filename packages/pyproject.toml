[tool.uv.workspace]
members = [
    "contracts",
    "preprocessing",
    "runtime-azure",
]

[dependency-groups]
dev = [
    "packaging==26.3",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[tool.ruff]
target-version = "py312"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = [
    "contracts/src",
    "contracts/tests",
    "preprocessing/src",
    "preprocessing/tests",
    "runtime-azure/src",
    "runtime-azure/tests",
]
reportMissingTypeStubs = "warning"
reportUnknownParameterType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownMemberType = "error"
reportUntypedFunctionDecorator = "error"
